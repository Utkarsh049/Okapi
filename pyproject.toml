[tool.uv.workspace]
members = ["apps/api", "packages/shared"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/api/src/okapi_api/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["okapi_api", "okapi_shared"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/api/src", "packages/shared/src"]
exclude = ["apps/api/src/okapi_api/db/migrations/"]

[[tool.mypy.overrides]]
module = ["passlib.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/shared/tests"]
asyncio_mode = "auto"

[project]
name = "okapi-api"
version = "0.1.0"
description = "Okapi FastAPI service — Trusted Data Core, Verification Gate, AI Action Layer."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    "anthropic>=0.40",
    "okapi-shared",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
okapi-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okapi_api"]

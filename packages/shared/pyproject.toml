[project]
name = "okapi-shared"
version = "0.1.0"
description = "Okapi cross-layer contracts and enums (no I/O, no framework imports)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okapi_shared"]
